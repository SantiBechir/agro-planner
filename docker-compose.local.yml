# Pruebas HTTP en esta computadora. No usar en el servidor público.
# docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  migrate:
    environment: &local-env
      DJANGO_SETTINGS_MODULE: config.settings.docker_local
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: ""
      SECURE_SSL_REDIRECT: "false"
      TRUST_PROXY_CLIENT_IP: "false"

  web:
    environment: *local-env
    # Compose >= 2.24.4: reemplazar la publicación de producción, sin añadirla.
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    command:
      - sh
      - -c
      - python manage.py check --fail-level WARNING && python manage.py collectstatic --noinput && exec gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -

  worker:
    environment: *local-env
