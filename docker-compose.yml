services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agroplanner}
      POSTGRES_USER: ${POSTGRES_USER:-agro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Migra y carga el input una vez, antes de iniciar web y worker.
  migrate:
    build: .
    command: python manage.py deploy_release
    environment: &app-env
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatoria}
      DATABASE_URL: postgres://${POSTGRES_USER:-agro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agroplanner}
      DATABASE_SSL_REQUIRE: "false"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS debe indicar el dominio del servidor}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      TRUST_PROXY_CLIENT_IP: ${TRUST_PROXY_CLIENT_IP:-false}
      SOLVER_TIME_LIMIT: ${SOLVER_TIME_LIMIT:-300}
      SOLVER_THREADS: ${SOLVER_THREADS:-2}
      MAX_ACTIVE_PLANIFICATIONS: ${MAX_ACTIVE_PLANIFICATIONS:-5}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    environment: *app-env
    ports:
      # Usar la IP privada del host si el proxy corre en otro servidor.
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    restart: unless-stopped
    command: python manage.py process_optimizations --loop --interval 5
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
