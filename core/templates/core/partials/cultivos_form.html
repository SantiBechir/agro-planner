{% if messages %}
<div class="mb-4 space-y-2">
    {% for message in messages %}
    <div class="rounded-xl border border-red-200 bg-red-50 p-3 text-sm font-semibold text-red-800 flex items-center justify-between gap-3">
        <span>{{ message }}</span>
        <button
            type="button"
            class="text-red-400 hover:text-red-700 text-base leading-none"
            aria-label="Cerrar error"
            onclick="this.parentElement.remove()"
        >
            &times;
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}

{% csrf_token %}

<div class="grid grid-cols-1 gap-4">
    <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">
            Nombre
        </label>
        <input
            type="text"
            name="nombre"
            value="{{ form_data.nombre|default:'' }}"
            required
            placeholder="Ej: Cebada Forrajera"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#4d8b4f] focus:ring-1 focus:ring-[#4d8b4f]"
        />
    </div>
</div>

<div class="grid grid-cols-2 gap-4">
    <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">
            Tipo de Cultivo
        </label>

        <select
            name="tipo"
            required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#4d8b4f] focus:ring-1 focus:ring-[#4d8b4f]"
        >
            <option value="principal" {% if form_data.tipo == "principal" %}selected{% endif %}>
                De Renta
            </option>

            <option value="secundario" {% if form_data.tipo == "secundario" %}selected{% endif %}>
                De Servicio
            </option>

            <option value="otro" {% if form_data.tipo == "otro" %}selected{% endif %}>
                Otro / Barbecho
            </option>
        </select>
    </div>

    <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">
            Días de Ciclo
        </label>

        <input
            type="number"
            name="duracion_dias"
            value="{{ form_data.duracion_dias|default:'' }}"
            required
            placeholder="Ej: 120"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#4d8b4f] focus:ring-1 focus:ring-[#4d8b4f]"
        />
    </div>
</div>

<div class="grid grid-cols-2 gap-4">
    <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">
            Siembra Inicio (Fecha)
        </label>

        <input
            type="date"
            name="siembra_inicio_fecha"
            value="{{ form_data.siembra_inicio_fecha|default:'' }}"
            min="{{ min_date }}"
            max="{{ max_date }}"
            required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#4d8b4f] focus:ring-1 focus:ring-[#4d8b4f]"
        />
    </div>

    <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">
            Siembra Fin (Fecha)
        </label>

        <input
            type="date"
            name="siembra_fin_fecha"
            value="{{ form_data.siembra_fin_fecha|default:'' }}"
            min="{{ min_date }}"
            max="{{ max_date }}"
            required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#4d8b4f] focus:ring-1 focus:ring-[#4d8b4f]"
        />
    </div>
</div>

<div class="flex items-center space-x-2">
    <input
        type="checkbox"
        id="no_repetir_sin_intermedio"
        name="no_repetir_sin_intermedio"
        {% if form_data.no_repetir_sin_intermedio %}checked{% endif %}
        class="rounded border-slate-300 text-[#4d8b4f] focus:ring-[#4d8b4f]"
    />

    <label
        for="no_repetir_sin_intermedio"
        class="text-xs font-bold text-slate-500 uppercase tracking-wider"
    >
        No repetir en años consecutivos
    </label>
</div>

<div class="border-t border-slate-200 pt-3">
    <p class="text-xs font-bold text-slate-600 mb-2 uppercase tracking-wider">
        Rendimientos estimados por suelo
    </p>

    <div class="grid grid-cols-3 gap-3">
        {% for suelo in tipos_suelo %}
        <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">
                {{ suelo.nombre }} (t/ha)
            </label>

            <input
                type="number"
                step="0.1"
                name="rendimiento_{{ suelo.id }}"
                value="{{ suelo.form_value|default:'' }}"
                required
                placeholder="0.0"
                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-[#4d8b4f] focus:ring-1 focus:ring-[#4d8b4f]"
            />
        </div>
        {% endfor %}
    </div>
</div>

<div class="flex justify-end space-x-3 pt-4 border-t border-slate-200">
    <button
        type="button"
        @click="showModal = false"
        class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition"
    >
        Cancelar
    </button>

    <button
        type="submit"
        class="px-5 py-2 bg-[#4d8b4f] hover:bg-[#3d6f3f] text-white font-bold rounded-xl text-sm transition shadow-md shadow-emerald-700/10"
    >
        Guardar Cultivo
    </button>
</div>
