<!-- Modal de Agregar Cultivo -->
<div
    x-show="showModal"
    class="fixed inset-0 z-50 overflow-y-auto"
    style="display: none"
>
    <!-- Fondo oscuro -->
    <div
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"
    ></div>

    <!-- Contenedor del Modal -->
    <div class="flex min-h-full items-center justify-center p-4 text-center">
        <div
            id="modal-content"
            @click.away="showModal = false"
            class="relative transform overflow-hidden rounded-2xl bg-white p-6 text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-emerald-500/10"
        >
            <div class="flex items-center justify-between border-b border-slate-200 pb-4 mb-4">
                <h3 class="text-lg font-bold text-[#2f5e31]">
                    Agregar Nuevo Cultivo
                </h3>

                <button
                    type="button"
                    @click="showModal = false"
                    class="text-slate-400 hover:text-slate-600 transition"
                >
                    <svg
                        class="h-6 w-6"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M6 18L18 6M6 6l12 12"
                        />
                    </svg>
                </button>
            </div>

            <form
                hx-post="{% url 'cultivo_create' %}"
                hx-target="#modal-content"
                class="space-y-4"
            >
                {% include "core/partials/cultivos_form.html" %}
            </form>

        </div>
    </div>
</div>
