{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgroPlanner - Optimización Agrícola{% endblock %}</title>

    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Gráficos de indicadores -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script>
        function renderIndifferenceChart() {
            const canvas = document.getElementById('ri-bar-chart');
            if (!canvas || !canvas.dataset.chart || !window.Chart) return;

            if (canvas._chart) canvas._chart.destroy();
            const data = JSON.parse(canvas.dataset.chart);
            canvas._chart = new Chart(canvas, {
                type: 'bar',
                data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    devicePixelRatio: Math.max(2, window.devicePixelRatio || 1),
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => `${context.dataset.label}: ${new Intl.NumberFormat('es-AR').format(context.raw)} kg/ha`
                            }
                        }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { font: { weight: 'bold' } } },
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'kg/ha', font: { weight: 'bold' } },
                            ticks: { callback: (value) => new Intl.NumberFormat('es-AR').format(value) }
                        }
                    }
                }
            });
        }
        function toggleRiDataset(button) {
            const canvas = document.getElementById('ri-bar-chart');
            const chart = canvas?._chart;
            if (!chart) return;
            const index = Number(button.dataset.riDataset);
            const visible = chart.isDatasetVisible(index);
            chart.setDatasetVisibility(index, !visible);
            chart.update();
            button.classList.toggle('opacity-40', visible);
            button.classList.toggle('line-through', visible);
        }
        function formatRiMaximumYield() {
            document.querySelectorAll('p').forEach((element) => {
                const match = element.textContent.trim().match(/^(\d+) kg\/ha$/);
                if (match) {
                    element.textContent = `${new Intl.NumberFormat('es-AR').format(Number(match[1]))} kg/ha`;
                }
            });
        }
        function toggleRiCropPicker() {
            const picker = document.getElementById('ri-crop-picker');
            if (!picker) return;
            if (!picker.querySelector('[data-ri-crop-apply]')) {
                const footer = document.createElement('div');
                footer.className = 'mt-4 flex justify-end border-t border-slate-100 pt-3';
                footer.innerHTML = '<button type="button" data-ri-crop-apply onclick="applyRiCropSelection()" class="rounded-lg bg-[#4d8b4f] px-4 py-2 text-sm font-bold text-white hover:bg-[#3d7440]">Aplicar</button>';
                picker.appendChild(footer);
            }
            picker.classList.toggle('hidden');
        }
        function setRiCropMode(mode) {
            const picker = document.getElementById('ri-crop-picker');
            const modeInput = document.getElementById('ri-cultivo-mode');
            if (!picker || !modeInput) return;
            modeInput.value = mode;
            picker.querySelectorAll('input[name="ri_cultivo"]').forEach((input) => {
                input.checked = mode === 'all';
            });
        }
        function syncRiCropSelection() {
            const picker = document.getElementById('ri-crop-picker');
            const modeInput = document.getElementById('ri-cultivo-mode');
            if (!picker || !modeInput) return;

            const inputs = Array.from(picker.querySelectorAll('input[name="ri_cultivo"]'));
            const selected = inputs.filter((input) => input.checked);
            modeInput.value = selected.length === inputs.length ? 'all' : 'selected';

            const visibleSelection = picker.previousElementSibling;
            visibleSelection.innerHTML = '';
            selected.forEach((input) => {
                const chip = document.createElement('span');
                chip.className = 'inline-flex items-center gap-2 rounded-lg border border-[#4d8b4f] bg-emerald-50 px-3 py-2 text-sm font-bold text-[#2f5e31]';
                chip.textContent = input.nextElementSibling.textContent.trim();
                visibleSelection.appendChild(chip);
            });
            const addButton = document.createElement('button');
            addButton.type = 'button';
            addButton.onclick = toggleRiCropPicker;
            addButton.className = 'flex h-9 w-9 items-center justify-center rounded-lg border border-dashed border-[#4d8b4f] bg-white text-xl font-bold text-[#2f5e31] hover:bg-emerald-50';
            addButton.setAttribute('aria-label', 'Agregar cultivos');
            addButton.textContent = '+';
            visibleSelection.appendChild(addButton);
        }
        function applyRiCropSelection() {
            const picker = document.getElementById('ri-crop-picker');
            syncRiCropSelection();
            picker.classList.add('hidden');
        }
        document.addEventListener('DOMContentLoaded', renderIndifferenceChart);
        document.addEventListener('htmx:afterSettle', renderIndifferenceChart);
        document.addEventListener('DOMContentLoaded', formatRiMaximumYield);
        document.addEventListener('htmx:afterSettle', formatRiMaximumYield);
        document.addEventListener('DOMContentLoaded', syncRiCropSelection);
        document.addEventListener('htmx:afterSettle', syncRiCropSelection);
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('{% static "core/imagen/fondo.png" %}');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        #main-content {
            overflow-anchor: none;
        }
        #ri-cultivo-mode + div span,
        #ri-crop-picker label span {
            font-size: 0.75rem;
            padding: 0.35rem 0.6rem;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(77, 139, 79, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(77, 139, 79, 0.6);
        }
    </style>
</head>

<body class="h-full font-sans text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
    <div class="min-h-full">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
